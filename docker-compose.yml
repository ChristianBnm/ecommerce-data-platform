version: "3.9"

services:

  frontend:
    container_name: ecommerce_frontend
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
    networks:
      - app-network

  backend:
    container_name: ecommerce_backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/ecommerce
    networks:
      - app-network

  database:
    container_name: ecommerce_database
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  etl:
    container_name: ecommerce_etl
    build:
      context: ./etl
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/ecommerce
    networks:
      - app-network

volumes:

  postgres-data:

networks:

  app-network:
    driver: bridge